[build-system]
requires = ["setuptools", "toml"]
build-backend = "setuptools.build_meta"

[project]
name = "dranmar-repository-validation"
version = "0.1.0"
description = "Locked non-Isaac validation environment for the Dr.Anmar research repository"
requires-python = "==3.10.*"
dependencies = [
    "fastapi==0.116.1",
    "h5py==3.14.0",
    "httpx==0.28.1",
    "matplotlib==3.10.3",
    "numpy==2.2.6",
    "pillow==11.3.0",
    "pydantic==2.11.7",
    "pytest==8.4.1",
    "scipy==1.15.3",
    "trimesh==4.7.1",
    "usd-core==25.11",
    "uvicorn==0.35.0",
]

[dependency-groups]
dev = [
    "pyright==1.1.403",
    "ruff==0.12.5",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.isort]

atomic = true
profile = "black"
line_length = 120
py_version = 310
skip_glob = ["docs/*", "logs/*"]
group_by_package = true

sections = [
    "FUTURE",
    "STDLIB",
    "THIRDPARTY",
    "FIRSTPARTY",
    "ISAACLABPARTY",
    "LOCALFOLDER",
]
extra_standard_library = [
    "numpy",
    "h5py",
    "open3d",
    "torch",
    "tensordict",
    "bpy",
    "matplotlib",
    "gymnasium",
    "gym",
    "scipy",
    "hid",
    "yaml",
    "prettytable",
    "toml",
    "trimesh",
    "tqdm",
]
known_thirdparty = [
    "isaacsim.core.api",
    "omni.replicator.isaac",
    "omni.replicator.core",
    "pxr",
    "omni.kit.*",
    "warp",
    "carb",
]
known_isaaclabparty = [
    "isaaclab",
    "isaaclab_tasks",
    "isaaclab_assets",
]
# Imports from this repository
known_first_party = "orbit.surgical.tasks"
known_assets_firstparty = "orbit.surgical.assets"
# Imports from the local folder
known_local_folder = "config"

[tool.pyright]

exclude = [
    "**/__pycache__",
    "**/docs",
    "**/logs",
    ".git",
    ".vscode",
]

typeCheckingMode = "basic"
pythonVersion = "3.10"
pythonPlatform = "Linux"
enableTypeIgnoreComments = true

# This is required as the CI pre-commit does not download the module (i.e. numpy, torch, prettytable)
# Therefore, we have to ignore missing imports
reportMissingImports = "none"
# This is required to ignore for type checks of modules with stubs missing.
reportMissingModuleSource = "none" # -> most common: prettytable in mdp managers

reportGeneralTypeIssues = "none"       # -> raises 218 errors (usage of literal MISSING in dataclasses)
reportOptionalMemberAccess = "warning" # -> raises 8 errors
reportPrivateUsage = "warning"
