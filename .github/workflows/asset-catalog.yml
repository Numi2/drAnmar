name: Asset catalog

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Dr.Anmar
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Verify catalog structure and room references
        run: python3 scripts/dr_anmar_asset_registry.py verify

      - name: Run catalog unit tests
        run: |
          python3 -m pip install pytest
          python3 -m pytest -q tests/test_asset_registry.py
