name: Repository contracts

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  source-contracts:
    name: Source, browser, catalog, and unit contracts
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact Dr.Anmar tree
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          submodules: recursive
          persist-credentials: false

      - name: Assert exact asset-submodule gitlink
        shell: bash
        run: |
          expected="$(git ls-tree HEAD source/extensions/orbit.surgical.assets | awk '{print $3}')"
          actual="$(git -C source/extensions/orbit.surgical.assets rev-parse HEAD)"
          test -n "${expected}"
          test "${actual}" = "${expected}"

      - name: Set up locked Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.10"
          cache: pip

      - name: Install uv and locked validation environment
        run: |
          python -m pip install uv==0.6.14
          uv sync --locked --dev

      - name: Compile authored Python and parse shell
        run: |
          uv run python -m compileall -q scripts tests source/extensions/orbit.surgical.assets/orbit/surgical/assets
          git ls-files '*.sh' -z | xargs -0 -n1 bash -n

      - name: Run scoped lint and type gates
        run: |
          validation_python="$(uv run python -c 'import sys; print(sys.executable)')"
          uv run ruff check \
            scripts/check_public_release.py \
            scripts/dr_anmar_asset_registry.py \
            scripts/dr_anmar_multimodal_assets.py \
            scripts/dr_anmar_operator.py \
            scripts/generate_dranmar_multimodal_fixture.py \
            scripts/install_sufia_assets.py \
            scripts/localize_openusd_materials.py \
            scripts/validate_dranmar_dynamic_abdominal_patient.py \
            scripts/validate_openusd_dependencies.py \
            scripts/verify_dranmar_physics_next_receipt.py \
            tests/test_dranmar_operator_security.py \
            tests/test_install_sufia_assets.py \
            tests/test_multimodal_assets.py \
            tests/test_openusd_dependency_validation.py \
            tests/test_physics_next_lock.py \
            tests/test_public_release_policy.py
          uv run pyright --pythonpath "${validation_python}" \
            scripts/check_public_release.py \
            scripts/dr_anmar_multimodal_assets.py \
            scripts/dr_anmar_operator.py \
            scripts/generate_dranmar_multimodal_fixture.py \
            scripts/validate_openusd_dependencies.py \
            scripts/verify_dranmar_physics_next_receipt.py

      - name: Enforce public-release and catalog policies
        run: |
          uv run python scripts/check_public_release.py
          uv run python scripts/refresh_dynamic_patient_asset_manifest.py --check
          uv run python scripts/generate_dranmar_multimodal_fixture.py --check
          uv run python scripts/dr_anmar_multimodal_assets.py
          uv run python scripts/dr_anmar_asset_registry.py verify

      - name: Run complete CPU and browser test suites
        run: |
          uv run python -m pytest -q tests
          node --test tests/hand_control.test.mjs

  native-openusd:
    name: Native OpenUSD parse, composition, and dependency closure
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact Dr.Anmar tree
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.10"
          cache: pip

      - name: Install pinned native OpenUSD
        run: python -m pip install -r scripts/requirements_openusd_validation.txt pytest

      - name: Require native parsing, composition, and closed dependencies
        run: |
          python scripts/validate_openusd_layers.py
          python scripts/validate_openusd_dependencies.py
          python scripts/localize_openusd_materials.py --check
          python scripts/generate_dranmar_dynamic_abdominal_patient_rigid_proxy.py --check

      - name: Run focused native OpenUSD tests
        run: |
          python -m pytest -q \
            tests/test_openusd_layer_validation.py \
            tests/test_openusd_dependency_validation.py
