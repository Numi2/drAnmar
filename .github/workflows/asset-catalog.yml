name: Asset catalog

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Dr.Anmar
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install validation dependencies
        run: |
          python3 -m pip install \
            -r scripts/requirements_openusd_validation.txt \
            pytest

      - name: Require native OpenUSD parsing for every USD layer
        run: |
          python3 scripts/validate_openusd_layers.py
          python3 \
            scripts/generate_dranmar_dynamic_abdominal_patient_rigid_proxy.py \
            --check

      - name: Verify catalog structure, release lock, and generated index
        run: python3 scripts/dr_anmar_asset_registry.py verify

      - name: Run catalog and OpenUSD validation unit tests
        run: |
          python3 -m pytest -q \
            tests/test_asset_registry.py \
            tests/test_dranmar_asset_catalog.py \
            tests/test_i4h_asset_receipt.py \
            tests/test_openusd_layer_validation.py
