name: NVIDIA native qualification

on:
  workflow_dispatch:
    inputs:
      step_count:
        description: Native simulator steps per smoke lane
        required: true
        default: "240"

permissions:
  contents: read

jobs:
  qualify:
    name: Exact-stack CUDA mechanics qualification
    runs-on:
      - self-hosted
      - linux
      - x64
      - dranmar-nvidia
    timeout-minutes: 90
    env:
      OMNI_KIT_ACCEPT_EULA: "YES"
    steps:
      - name: Check out exact Dr.Anmar tree
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          submodules: recursive
          persist-credentials: false

      - name: Assert runner qualification prerequisites
        shell: bash
        run: |
          test -n "${ISAAC_PYTHON:-}"
          test -x "${ISAAC_PYTHON}"
          nvidia-smi
          "${ISAAC_PYTHON}" scripts/dr_anmar_doctor.py

      - name: Run generic startup and camera smoke
        shell: bash
        run: |
          ./dr_anmar.sh smoke Isaac-Reach-PSM-v0 "${{ inputs.step_count }}"

      - name: Run dynamic laparotomy native scene
        shell: bash
        env:
          DR_ANMAR_ROOT: ${{ runner.temp }}/dranmar-native-runtime
        run: |
          mkdir -p "${DR_ANMAR_ROOT}/run/qualification"
          ./dr_anmar.sh laparotomy "${{ inputs.step_count }}" \
            "${DR_ANMAR_ROOT}/run/qualification/laparotomy.png"

      - name: Run dynamic-patient retained source validation
        shell: bash
        env:
          DR_ANMAR_ROOT: ${{ runner.temp }}/dranmar-native-runtime
        run: |
          "${ISAAC_PYTHON}" scripts/validate_dranmar_dynamic_abdominal_patient.py \
            --output "${DR_ANMAR_ROOT}/run/qualification/dynamic-patient-source.json"

      - name: Upload exact-stack artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dranmar-nvidia-native-${{ github.sha }}
          path: |
            ${{ runner.temp }}/dranmar-native-runtime/logs
            ${{ runner.temp }}/dranmar-native-runtime/run/qualification
          if-no-files-found: error
          retention-days: 30
