name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  source-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check public snapshot
        run: python scripts/check_public_release.py
      - name: Check web syntax
        run: python scripts/check_web_syntax.py
      - name: Test webcam teleoperation contracts
        run: |
          python -m unittest tests/test_hand_teleop.py -v
          node --test tests/hand_control.test.mjs
      - name: Check DrAnmar skin stapler asset
        run: python scripts/check_skin_stapler_asset.py
      - name: Compile Python source
        run: python -m compileall -q scripts source
      - name: Check shell syntax
        run: |
          bash -n dr_anmar.sh dr_anmar_suite.sh dr_anmar_train.sh dr_anmar_workstation.sh orbitsurgical.sh
          bash -n dr_anmar_suture_asset.sh dr_anmar_suture_native.sh dr_anmar_tissue_asset.sh
