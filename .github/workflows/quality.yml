name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  source-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check public snapshot
        run: python scripts/check_public_release.py
      - name: Audit project consistency
        run: |
          python scripts/audit_project_consistency.py
          python scripts/audit_keyboard_controls.py
          python scripts/dr_anmar_physics_next.py validate
          python scripts/audit_operator_lease.py
          python scripts/check_web_syntax.py
      - name: Compile Python source
        run: python -m compileall -q scripts source
      - name: Check shell syntax
        run: bash -n dr_anmar.sh dr_anmar_suite.sh dr_anmar_train.sh dr_anmar_workstation.sh orbitsurgical.sh
