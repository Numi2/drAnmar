name: Feature request
description: Propose a simulation, education, or robot-learning improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: Research or learning need
      description: What should a doctor, learner, or researcher be able to accomplish?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed experience
      description: Describe the workflow in plain language from start to finish.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: How could it be validated?
      description: Include observable success criteria and relevant simulation tasks.
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmation
      options:
        - label: This proposal remains simulation-only and makes no clinical-readiness claim.
          required: true
